name: Publish to OBS

# A validação obrigatória de PR vive em contracts.yml. Este workflow apenas
# solicita ao OBS a atualização da fonte em tags; se credencial ou chamada
# falhar, a release deve ficar vermelha e exigir intervenção explícita.
#
# O fluxo real de publicação no pacote home:rodrigosbrito:lyra/sheliak é manual:
# gerar dist/ (`npm run build`) + tarball localmente e subir via `osc` a cada
# release — o sistema de tokens do OBS só cobre 5 operações fixas (runservice,
# branch, release, rebuild, workflow), nenhuma delas "enviar um arquivo".
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch: {}

jobs:
  trigger-obs:
    runs-on: ubuntu-latest
    steps:
      - name: Exigir credencial de publicação
        env:
          OBS_TOKEN: ${{ secrets.OBS_TOKEN_LYRA_SHELIAK }}
        run: |
          if [ -z "$OBS_TOKEN" ]; then
            echo "OBS_TOKEN_LYRA_SHELIAK não configurado; publicação bloqueada." >&2
            exit 1
          fi
      - name: Disparar serviço OBS obrigatório
        env:
          OBS_TOKEN: ${{ secrets.OBS_TOKEN_LYRA_SHELIAK }}
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Token $OBS_TOKEN" \
            -X POST "https://api.opensuse.org/trigger/runservice?project=home:rodrigosbrito:lyra&package=sheliak"
