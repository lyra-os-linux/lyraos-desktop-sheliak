name: Contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext libglib2.0-bin locales rpm
          for locale in en_US pt_BR es_ES fr_FR; do
            sudo localedef -i "$locale" -f UTF-8 "$locale.UTF-8"
          done
          # Exercise gettext's modifier fallback with a valid libc locale.
          sudo localedef -i pt_BR -f UTF-8 'pt_BR.UTF-8@custom'
      - run: npm ci
      - name: Validate TypeScript, bundle, translations and packaging
        run: |
          npm run check
          npm test
          rpmspec -P packaging/sheliak.spec >/dev/null
      - name: Verify build reproducibility
        run: |
          cp -a dist /tmp/sheliak-dist-first
          npm run build
          diff -ru /tmp/sheliak-dist-first dist
